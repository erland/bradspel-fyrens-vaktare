name: Validate

on:
  pull_request:
    paths:
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "assets/**"
      - "templates/**"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "CHANGELOG.md"
      - "PROJECT_HANDOFF.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "assets/**"
      - "templates/**"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "CHANGELOG.md"
      - "PROJECT_HANDOFF.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate project
        run: python scripts/ci_validate_project.py .
