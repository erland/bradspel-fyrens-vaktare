name: Build Print Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "release/**"
      - "assets/**"
      - "templates/**"

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml cairosvg

      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core
          fc-cache -f

      - name: Validate project
        run: python scripts/ci_validate_project.py .

      - name: Build preview PDFs
        run: python scripts/ci_build_print_preview.py --output-dir "${RUNNER_TEMP}/fyrens-vaktare-print-preview"

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: fyrens-vaktare-print-preview
          path: ${{ runner.temp }}/fyrens-vaktare-print-preview/**
          if-no-files-found: error
          retention-days: 7
